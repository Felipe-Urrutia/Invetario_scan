<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Escáner Pro (Auto-guardado)</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 10px; background: #f4f4f9; margin: 0; }
        h2 { text-align: center; color: #333; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; background: white; }
        .table-container { margin-top: 20px; width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background: white; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; }
        th { background-color: #007bff; color: white; }
        
        /* Contenedor de botones para que se vean bien juntos */
        .btn-container { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        
        .btn { 
            display: none; width: 100%; padding: 15px; 
            color: white; border: none; box-sizing: border-box;
            border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .export-btn { background: #28a745; }
        .clear-btn { background: #dc3545; }
    </style>
</head>
<body>

    <h2>Escáner de Inventario</h2>
    
    <div id="reader"></div>

    <div class="table-container">
        <table id="scannedTable">
            <thead>
                <tr>
                    <th>Código</th>
                    <th>Cantidad</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <div class="btn-container">
        <button class="btn export-btn" id="btnExportar" onclick="exportarExcel()">Exportar a XLS</button>
        <button class="btn clear-btn" id="btnLimpiar" onclick="limpiarInventario()">Limpiar Todo el Inventario</button>
    </div>

    <script>
        // Cargar datos previamente guardados en el celular
        let inventario = JSON.parse(localStorage.getItem("inventario_celular")) || {};
        let ultimoCodigo = "";
        let tiempoUltimoEscaneo = 0;

        // Mostrar la tabla si ya hay datos guardados al cargar la página
        document.addEventListener("DOMContentLoaded", () => {
            actualizarTabla();
        });

        // Función para generar el sonido "Beep"
        function sonarBeep() {
            try {
                let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                let oscillator = audioCtx.createOscillator();
                let gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("No se pudo reproducir el audio: ", e);
            }
        }

        // Lógica del escáner
        function onScanSuccess(decodedText, decodedResult) {
            let tiempoActual = new Date().getTime();
            
            // Pausa para evitar leer el mismo código repetidamente
            if (decodedText === ultimoCodigo && (tiempoActual - tiempoUltimoEscaneo) < 2500) {
                return;
            }

            ultimoCodigo = decodedText;
            tiempoUltimoEscaneo = tiempoActual;

            sonarBeep();

            // Pequeño retraso para evitar que el 'prompt' congele el video de la cámara
            setTimeout(() => {
                let inputCantidad = prompt(`Código detectado:\n${decodedText}\n\nIngrese la cantidad a registrar:`, "1");

                if (inputCantidad === null || inputCantidad.trim() === "") {
                    return;
                }

                let cantidad = parseInt(inputCantidad, 10);

                if (isNaN(cantidad) || cantidad <= 0) {
                    alert("Cantidad no válida. El código no fue registrado.");
                    return;
                }

                if (inventario[decodedText]) {
                    inventario[decodedText] += cantidad;
                } else {
                    inventario[decodedText] = cantidad;
                }

                actualizarTabla();
            }, 100);
        }

        // Actualizar la vista de la tabla y guardar en LocalStorage
        function actualizarTabla() {
            const tbody = document.querySelector("#scannedTable tbody");
            tbody.innerHTML = ""; 
            
            let tieneDatos = false;

            for (let codigo in inventario) {
                tieneDatos = true;
                let fila = document.createElement("tr");
                
                let celdaCodigo = document.createElement("td");
                celdaCodigo.textContent = codigo;
                
                let celdaCantidad = document.createElement("td");
                celdaCantidad.textContent = inventario[codigo];
                
                fila.appendChild(celdaCodigo);
                fila.appendChild(celdaCantidad);
                tbody.appendChild(fila);
            }

            // Guardar los datos en la memoria interna
            localStorage.setItem("inventario_celular", JSON.stringify(inventario));

            if (tieneDatos) {
                document.getElementById("btnExportar").style.display = "block";
                document.getElementById("btnLimpiar").style.display = "block";
            } else {
                document.getElementById("btnExportar").style.display = "none";
                document.getElementById("btnLimpiar").style.display = "none";
            }
        }

        // Función para borrar la memoria interna
        function limpiarInventario() {
            if (confirm("⚠️ ¿Estás seguro de que deseas borrar TODO el inventario guardado en este celular? Esta acción no se puede deshacer.")) {
                inventario = {};
                localStorage.removeItem("inventario_celular");
                actualizarTabla();
            }
        }

        // Generar y descargar el archivo XLS
        function exportarExcel() {
            let tablaHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="utf-8"></head><body><table border="1">
            <tr><th style="background-color:#007bff; color:white;">Código de Barra</th><th style="background-color:#007bff; color:white;">Cantidad</th></tr>`;
            
            for (let codigo in inventario) {
                tablaHtml += `<tr><td style="mso-number-format:'\\@';">${codigo}</td><td>${inventario[codigo]}</td></tr>`;
            }
            
            tablaHtml += `</table></body></html>`;

            let blob = new Blob(['\ufeff', tablaHtml], { type: 'application/vnd.ms-excel' });
            let url = URL.createObjectURL(blob);
            
            let a = document.createElement('a');
            a.href = url;
            
            let fecha = new Date().toISOString().slice(0, 10);
            a.download = `inventario_${fecha}.xls`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Iniciar el escáner
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 150} }, 
            false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>

</body>
</html>
