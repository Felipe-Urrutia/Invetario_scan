<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Capturador de Inventario</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1d4ed8">
    
    <script src="./html5-qrcode.min.js"></script>

    <style>
        /* Diseño profesional, serio pero con colores vibrantes para agilizar la lectura */
        :root { --primary: #1d4ed8; --secondary: #3b82f6; --bg: #f3f4f6; --text: #1f2937; --success: #10b981; --danger: #ef4444; }
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; background-color: var(--bg); color: var(--text); padding-bottom: 80px; }
        header { background-color: var(--primary); color: white; padding: 18px; text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.5px; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 22px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 4px solid var(--secondary); }
        h2 { margin-top: 0; font-size: 1.2rem; border-bottom: 2px solid var(--bg); padding-bottom: 10px; color: var(--primary); }
        label { display: block; font-size: 0.9rem; margin-bottom: 6px; color: #4b5563; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        input { width: 100%; padding: 14px; margin-bottom: 18px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 1.1rem; transition: border-color 0.2s; }
        input:focus { border-color: var(--primary); outline: none; }
        button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: transform 0.1s, opacity 0.2s; margin-bottom: 10px; }
        button:active { transform: scale(0.98); }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-camara { background-color: #4f46e5; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-success { background-color: var(--success); color: white; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-config { background: #6b7280; color: white; width: auto; padding: 6px 12px; font-size: 0.85rem; margin: 0; border-radius: 6px; }
        .hidden { display: none !important; }
        .scan-count { text-align: center; font-size: 2.5rem; font-weight: 800; color: var(--primary); margin: 10px 0; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--bg); padding-bottom: 10px; margin-bottom: 15px; }
        .header-flex h2 { border: none; padding: 0; margin: 0; }
        #lector-qr { border-radius: 8px; overflow: hidden; border: 2px solid var(--primary); }
    </style>
</head>
<body>

<header>
    <h1>Capturador de Inventario</h1>
</header>

<div class="container">
    <div id="pantalla-config" class="card">
        <h2>Configuración de Sesión</h2>
        <label>Tipo de Fleje</label>
        <input type="number" id="inp-fleje" placeholder="Ej: 911" value="911">
        
        <label>Código de Sección</label>
        <input type="number" id="inp-seccion" placeholder="Ej: 06 o 04">
        
        <label>Guía de Posición (Mueble/Sector)</label>
        <input type="text" id="inp-posicion" placeholder="Ej: SA" maxlength="2" style="text-transform: uppercase;">
        
        <button class="btn-primary" onclick="guardarConfiguracion()">Fijar Datos e Iniciar</button>
    </div>

    <div id="pantalla-captura" class="card hidden">
        <div class="header-flex">
            <h2>Ingreso de Producto</h2>
            <button class="btn-config" onclick="editarConfiguracion()">⚙️ Editar</button>
        </div>
        
        <button id="btn-camara" class="btn-camara" onclick="iniciarCamara()">📷 Activar Lector Láser</button>
        <div id="lector-qr" class="hidden" style="width: 100%; margin-bottom: 15px;"></div>

        <label>Código EAN</label>
        <input type="number" id="inp-codigo" placeholder="Escanea o teclea el código" min="1" autofocus>

        <label>Cantidad / Peso</label>
        <input type="number" id="inp-cantidad" placeholder="Ej: 3 o 1.250" step="0.001" min="0.001">
        
        <button class="btn-primary" onclick="registrarProducto()">💾 Guardar Producto</button>
    </div>

    <div id="pantalla-exportar" class="card hidden">
        <h2>Resumen del Inventario</h2>
        <p style="text-align: center; margin: 0; color: #6b7280; font-weight: bold;">Líneas Escaneadas:</p>
        <div class="scan-count" id="contador-escaneos">0</div>
        
        <button class="btn-success" onclick="exportarArchivo()">📊 Descargar Archivo Excel</button>
        <button class="btn-danger" onclick="limpiarDatos()">🗑️ Borrar Todo y Reiniciar</button>
    </div>
</div>

<script>
    // Variables globales
    let configActual = JSON.parse(localStorage.getItem('inventario_config')) || null;
    let listaEscaneos = JSON.parse(localStorage.getItem('inventario_datos')) || [];
    let correlativo = parseInt(localStorage.getItem('inventario_correlativo')) || 1;
    
    // Variables para el origen del código
    let esIngresoManual = true; 
    let escanerActivo = null;

    // Inicialización al cargar la página
    window.onload = () => {
        // Registrar el Service Worker para funcionamiento offline
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.error("Error en SW:", err));
        }
        
        // Si ya hay configuración guardada, saltar directo a capturar
        if (configActual) {
            mostrarPantallaCaptura();
        }
        actualizarContador();
    };

    // Si el usuario toca el input con el teclado, forzamos el modo manual (Indicador = 0)
    document.getElementById('inp-codigo').addEventListener('input', () => {
        esIngresoManual = true;
    });

    // --- FUNCIONES DE INTERFAZ ---
    function guardarConfiguracion() {
        const fleje = document.getElementById('inp-fleje').value;
        const seccion = document.getElementById('inp-seccion').value;
        const posicion = document.getElementById('inp-posicion').value;

        if (!fleje || !seccion || !posicion) {
            return alert("Por favor, completa los tres campos para iniciar el inventario.");
        }

        configActual = { fleje, seccion, posicion };
        localStorage.setItem('inventario_config', JSON.stringify(configActual));
        mostrarPantallaCaptura();
    }

    function editarConfiguracion() {
        document.getElementById('pantalla-config').classList.remove('hidden');
        document.getElementById('pantalla-captura').classList.add('hidden');
        
        document.getElementById('inp-fleje').value = configActual.fleje;
        document.getElementById('inp-seccion').value = configActual.seccion;
        document.getElementById('inp-posicion').value = configActual.posicion;
        
        detenerCamara(); // Por si la cámara quedó abierta
    }

    function mostrarPantallaCaptura() {
        document.getElementById('pantalla-config').classList.add('hidden');
        document.getElementById('pantalla-captura').classList.remove('hidden');
        document.getElementById('pantalla-exportar').classList.remove('hidden');
        document.getElementById('inp-codigo').focus();
    }

    // --- FUNCIONES DE LA CÁMARA (Librería html5-qrcode) ---
    function iniciarCamara() {
        const divLector = document.getElementById('lector-qr');
        divLector.classList.remove('hidden');
        document.getElementById('btn-camara').classList.add('hidden');

        escanerActivo = new Html5Qrcode("lector-qr");
        
        const configCamara = { 
            fps: 10, 
            qrbox: { width: 250, height: 100 },
            formatsToSupport: [ Html5QrcodeSupportedFormats.EAN_13, Html5QrcodeSupportedFormats.EAN_8 ]
        };

        escanerActivo.start({ facingMode: "environment" }, configCamara, 
            (textoDecodificado) => {
                // Éxito: Se leyó un código de barras
                document.getElementById('inp-codigo').value = textoDecodificado;
                esIngresoManual = false; // Indicador será '1'
                
                // Vibración háptica
                if(navigator.vibrate) navigator.vibrate(200);

                detenerCamara();
                document.getElementById('inp-cantidad').focus(); // Salto automático
            },
            (mensajeError) => {
                // Errores continuos de enfoque se ignoran silenciosamente
            }
        ).catch(err => {
            alert("No se pudo iniciar la cámara. Verifica los permisos del navegador.");
            detenerCamara();
        });
    }

    function detenerCamara() {
        if (escanerActivo) {
            escanerActivo.stop().then(() => {
                document.getElementById('lector-qr').classList.add('hidden');
                document.getElementById('btn-camara').classList.remove('hidden');
            }).catch(e => console.log(e));
        }
    }

    // --- LÓGICA DE LA TRAMA (Motor de Datos) ---
    function generarTramaExacta(numCorr, codigo, cant, fueManual) {
        const sufijoSistema = "001S"; // Fijo del terminal
        
        const corrF = numCorr.toString().padStart(6, '0');
        const indicadorF = fueManual ? "0" : "1"; // 0: Teclado, 1: Cámara
        const prodF = codigo.toString().padStart(13, '0');
        const cantF = Math.round(parseFloat(cant) * 1000).toString().padStart(9, '0');
        const flejeF = configActual.fleje.toString().padStart(3, '0');
        const seccionF = configActual.seccion.toString().padStart(5, '0');
        const posF = configActual.posicion.toString().substring(0, 2).toUpperCase().padStart(2, '0');
        
        return `${corrF}${indicadorF}${prodF}${cantF}${flejeF}${seccionF}${posF}${sufijoSistema}`;
    }

    function registrarProducto() {
        const codigo = document.getElementById('inp-codigo').value;
        const cantidad = document.getElementById('inp-cantidad').value;

    // 1. Validar que no estén vacíos
     if (!codigo || !cantidad) {
        return alert("Falta ingresar el código o la cantidad.");
     }

    // 2. Validar que la cantidad no sea negativa ni cero
    // Usamos parseFloat para asegurarnos de que evalúa el valor matemático, no como texto
     if (parseFloat(cantidad) <= 0) {
        document.getElementById('inp-cantidad').focus();
        return alert("Error: La cantidad o peso debe ser mayor a cero.");
     }

    // 3. Validar que el código no sea negativo
     if (parseFloat(codigo) <= 0) {
        document.getElementById('inp-codigo').focus();
        return alert("Error: El código del producto no puede ser negativo.");
     }

    // Si pasa todas las validaciones, generamos la trama
    const trama = generarTramaExacta(correlativo, codigo, cantidad, esIngresoManual);
    
    listaEscaneos.push(trama);
    localStorage.setItem('inventario_datos', JSON.stringify(listaEscaneos));
    
    correlativo++;
    localStorage.setItem('inventario_correlativo', correlativo);

    // Resetear para la siguiente línea
    document.getElementById('inp-codigo').value = '';
    document.getElementById('inp-cantidad').value = '';
    esIngresoManual = true; 
    document.getElementById('inp-codigo').focus();
    
    actualizarContador();
}


    function actualizarContador() {
        document.getElementById('contador-escaneos').innerText = listaEscaneos.length;
    }

    function exportarArchivo() {
        if (listaEscaneos.length === 0) return alert("No hay datos para exportar.");
        
        // 1. Creamos una estructura que Excel reconoce de forma nativa
        let tablaHTML = '<html xmlns:x="urn:schemas-microsoft-com:office:excel">';
        tablaHTML += '<head><meta charset="utf-8"></head><body><table>';
        
        // 2. Inyectamos cada trama en una fila de la tabla
        listaEscaneos.forEach(trama => {
            // El atributo mso-number-format:"\@" es vital: bloquea el formateo automático de Excel
            tablaHTML += `<tr><td style='mso-number-format:"\\@";'>${trama}</td></tr>`;
        });
        
        tablaHTML += '</table></body></html>';

        // 3. Generamos el archivo con la extensión y tipo de Microsoft Excel
        const blob = new Blob([tablaHTML], { type: 'application/vnd.ms-excel' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        
        // 4. Nombramos el archivo con extensión .xls
        const fecha = new Date().toLocaleDateString('es-CL').replace(/-/g, '');
        a.download = `INV_${configActual.posicion}_${configActual.seccion}_${fecha}.xls`;
        
        a.href = url;
        a.click();
        URL.revokeObjectURL(url);
    }
    
    function limpiarDatos() {
        if(confirm("⚠️ ¿Estás completamente seguro? Esto borrará todos los escaneos actuales sin descargar el archivo.")) {
            listaEscaneos = [];
            correlativo = 1;
            localStorage.removeItem('inventario_datos');
            localStorage.removeItem('inventario_correlativo');
            actualizarContador();
            detenerCamara();
        }
    }
</script>

</body>
</html>
